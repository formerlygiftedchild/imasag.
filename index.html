<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm a Sag. | Formerly Gifted Child</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts for Editorial Y2K & Signature Heading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sagBg: '#EA1A85',     // Hot Pink / Magenta Background
                        sagHeader: '#FF5D05', // Sunset Orange Banner Header
                        sagAccent: '#950650', // Deep Berry Accent
                        sagDark: '#4A0227',   // Deepest Burgundy Text
                    },
                    fontFamily: {
                        signature: ['Great Vibes', 'cursive'],
                        editorial: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #EA1A85; }
        ::-webkit-scrollbar-thumb { background: #950650; border-radius: 5px; border: 2px solid #FF5D05; }
        .y2k-shadow { box-shadow: 8px 8px 0px #950650, 14px 14px 25px rgba(0,0,0,0.35); }
        .y2k-shadow-sm { box-shadow: 4px 4px 0px #950650; }
        .y2k-header-bg {
            background: linear-gradient(135deg, #FF5D05 0%, #FF5D05 50%, #EA1A85 85%, #950650 100%);
            position: relative;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 10px 20px rgba(0,0,0,0.3);
        }
        .scrapbook-paper {
            background-color: #fffefb;
            background-image: linear-gradient(90deg, rgba(234,26,133,0.06) 50%, transparent 50%), linear-gradient(rgba(234,26,133,0.06) 50%, transparent 50%);
            background-size: 24px 24px;
            position: relative;
        }
        .cyber-window {
            background: linear-gradient(180deg, #ff85be 0%, #ea1a85 100%);
            border: 4px solid #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(74, 2, 39, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.6);
        }
        .cyber-window-header {
            background: linear-gradient(90deg, #FF5D05 0%, #EA1A85 100%);
            border-bottom: 3px solid #950650;
            padding: 8px 16px;
            border-top-left-radius: 18px;
            border-top-right-radius: 18px;
        }
        .glossy-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
        }
    </style>
</head>
<body class="scrapbook-paper min-h-screen text-sagDark font-sans pb-16">

    <!-- Header Banner -->
    <header class="y2k-header-bg text-white py-8 px-4 border-b-4 border-sagAccent text-center">
        <div class="max-w-4xl mx-auto space-y-2">
            <h1 class="font-signature text-5xl md:text-7xl text-yellow-200 drop-shadow-[3px_3px_0px_#4A0227]">I'm a Sag.</h1>
            <p class="font-editorial italic text-lg md:text-xl text-pink-100">Dispatches from a recovering gifted child navigating the chaos.</p>
            
            <!-- Navigation Tabs -->
            <div class="flex justify-center items-center gap-3 pt-4">
                <button onclick="switchTab('blogs')" id="nav-blogs-btn" class="bg-white text-sagAccent font-bold px-5 py-2 rounded-full y2k-shadow-sm hover:scale-105 transition-all text-xs flex items-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-book-open"></i> Dispatches
                </button>
                <button onclick="switchTab('thoughts')" id="nav-thoughts-btn" class="bg-sagDark/70 text-yellow-200 font-bold px-5 py-2 rounded-full border border-yellow-300/40 y2k-shadow-sm hover:scale-105 transition-all text-xs flex items-center gap-1.5">
                    <i class="fa-solid fa-comment-dots"></i> Stream of Consciousness
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 mt-8">

        <!-- Home View (Blog List) -->
        <div id="home-view" class="space-y-6">
            
            <!-- Search & Filters Toolbar -->
            <div class="cyber-window p-4 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="relative w-full md:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-sagDark/60 text-xs"></i>
                    <input type="text" oninput="handleSearch(this.value)" placeholder="Search dispatches..." class="w-full pl-9 pr-4 py-2 rounded-full text-xs bg-white/90 text-sagDark font-semibold focus:outline-none focus:ring-2 focus:ring-yellow-300">
                </div>
                
                <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-1 md:pb-0">
                    <button onclick="setFilter('latest')" id="filter-latest" class="bg-yellow-300 text-sagDark px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap y2k-shadow-sm">Latest ✨</button>
                    <button onclick="setFilter('popular')" id="filter-popular" class="bg-sagDark/60 text-white border border-pink-300/30 px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap hover:bg-sagDark">Popular 🔥</button>
                    <button onclick="setFilter('saved')" id="filter-saved" class="bg-sagDark/60 text-white border border-pink-300/30 px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap hover:bg-sagDark">Saves 🔖</button>
                    <button onclick="toggleLayoutView()" class="bg-white/90 text-sagAccent p-2 rounded-full text-xs font-bold y2k-shadow-sm hover:scale-110 transition-transform ml-auto">
                        <i id="layout-icon" class="fa-solid fa-border-all"></i>
                    </button>
                </div>
            </div>

            <!-- Articles Feed Container -->
            <div id="articles-container" class="space-y-6">
                <!-- Populated dynamically via JS -->
            </div>
        </div>

        <!-- Thoughts View (Micro-blog stream) -->
        <div id="thoughts-view" class="hidden space-y-6">
            <div class="cyber-window p-6 text-white space-y-4">
                <h2 class="font-editorial text-2xl font-bold text-yellow-200">Midnight Stream of Consciousness 💭</h2>
                <p class="text-xs text-pink-100">Unfiltered thoughts, late-night epiphanies, and random mental screenshots.</p>
            </div>
            <div id="thoughts-container" class="space-y-4">
                <!-- Populated dynamically via JS -->
            </div>
        </div>

        <!-- Article Detail View -->
        <div id="detail-view" class="hidden space-y-6">
            <button onclick="showHome()" class="bg-white text-sagAccent px-4 py-2 rounded-full text-xs font-bold y2k-shadow-sm hover:scale-105 transition-transform flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Dispatches
            </button>

            <article id="article-content-box" class="glossy-card p-6 md:p-10 rounded-3xl y2k-shadow space-y-6">
                <!-- Populated dynamically -->
            </article>
        </div>

    </main>

    <!-- Notification Toast -->
    <div id="notification-toast" class="fixed bottom-5 right-5 bg-sagDark text-white px-5 py-3 rounded-2xl y2k-shadow-sm transform translate-y-24 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 border border-pink-400">
        <i class="fa-solid fa-sparkles text-yellow-300 text-lg"></i>
        <div>
            <p id="toast-title" class="text-xs font-bold text-yellow-200"></p>
            <p id="toast-desc" class="text-[11px] text-pink-100"></p>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = 'https://erfvnuwaefkzopgnqhnq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ImRfcXmiHZQJVyMegoxglg_r8Blqrnn';
        
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- STATE MANAGEMENT ---
        let isGridView = false;
        let currentFilter = 'latest';
        let searchQuery = '';
        let activeArticleId = null;
        
        // Private local storage bookmarks
        let savedBookmarks = JSON.parse(localStorage.getItem('sag_bookmarks') || '{}');

        // Articles Dataset
        let articlesData = [
            {
                id: 'article-1',
                title: "Why Being a Sagittarius Means You're Never Truly Lost",
                snippet: "A deep dive into why we overshare, wander endlessly, and always find our way back to ourselves.",
                date: "Oct 24",
                image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80",
                content: "Being a Sagittarius isn't just an astrological sign—it's a full lifestyle experience. We roam, we question, and most importantly, we tell the truth even when it's uncomfortable.\n\nGrowing up as a 'gifted child' comes with a very specific burden: the expectation that you already have life figured out. But the real magic happens when you let go of perfectionism and lean into pure curiosity."
            },
            {
                id: 'article-2',
                title: "Unlearning the Gifted Child Syndrome",
                snippet: "How to stop seeking validation and start living for the chaos and beauty of right now.",
                date: "Oct 18",
                image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80",
                content: "When everyone spent your childhood telling you how 'smart' you were, failure starts feeling like an existential threat. Here is how I am romanticizing my mistakes and embracing being a beginner again."
            }
        ];

        let thoughtsData = [
            { id: 1, author: "Sag Thoughts", date: "Yesterday", text: "Burnout isn't a badge of honor, it's just your nervous system begging you to go touch grass." },
            { id: 2, author: "Sag Thoughts", date: "3 days ago", text: "Changing your mind is not inconsistency. It's called upgrading your firmware." }
        ];

        function isArticleSaved(id) {
            return !!savedBookmarks[id];
        }

        function showNotification(title, desc) {
            const toast = document.getElementById('notification-toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-desc').innerText = desc;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        function toggleBookmark(id) {
            savedBookmarks[id] = !savedBookmarks[id];
            localStorage.setItem('sag_bookmarks', JSON.stringify(savedBookmarks));
            
            const isNowSaved = savedBookmarks[id];
            showNotification(isNowSaved ? "Saved! 🔖" : "Unsaved", isNowSaved ? "Added to your private saves." : "Removed from your saves.");
            renderArticles();
        }

        function switchTab(tabName) {
            const homeView = document.getElementById('home-view');
            const thoughtsView = document.getElementById('thoughts-view');
            const detailView = document.getElementById('detail-view');
            const blogsBtn = document.getElementById('nav-blogs-btn');
            const thoughtsBtn = document.getElementById('nav-thoughts-btn');

            detailView.classList.add('hidden');
            if (tabName === 'blogs') {
                homeView.classList.remove('hidden'); thoughtsView.classList.add('hidden');
                blogsBtn.className = "bg-white text-sagAccent font-bold px-5 py-2 rounded-full y2k-shadow-sm hover:scale-105 transition-all text-xs flex items-center gap-1.5 shadow-md";
                thoughtsBtn.className = "bg-sagDark/70 text-yellow-200 font-bold px-5 py-2 rounded-full border border-yellow-300/40 y2k-shadow-sm hover:scale-105 transition-all text-xs flex items-center gap-1.5";
            } else if (tabName === 'thoughts') {
                homeView.classList.add('hidden'); thoughtsView.classList.remove('hidden');
                thoughtsBtn.className = "bg-white text-sagAccent font-bold px-5 py-2 rounded-full y2k-shadow-sm hover:scale-105 transition-all text-xs flex items-center gap-1.5 shadow-md";
                blogsBtn.className = "bg-sagDark/70 text-yellow-200 font-bold px-5 py-2 rounded-full border border-yellow-300/40 y2k-shadow-sm hover:scale-105 transition-all text-xs flex items-center gap-1.5";
                renderThoughts();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleLayoutView() {
            isGridView = !isGridView;
            const icon = document.getElementById('layout-icon');
            icon.className = isGridView ? "fa-solid fa-list" : "fa-solid fa-border-all";
            renderArticles();
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['latest', 'popular', 'saved'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if(btn) {
                    btn.className = (f === filter) ? "bg-yellow-300 text-sagDark px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap y2k-shadow-sm" : "bg-sagDark/60 text-white border border-pink-300/30 px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap hover:bg-sagDark";
                }
            });
            renderArticles();
        }

        function handleSearch(val) { searchQuery = val; renderArticles(); }

        function renderArticles() {
            const container = document.getElementById('articles-container');
            container.innerHTML = '';
            container.className = isGridView ? "grid grid-cols-1 md:grid-cols-2 gap-6" : "space-y-6";

            let filtered = articlesData.filter(a => 
                a.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                a.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
                a.snippet.toLowerCase().includes(searchQuery.toLowerCase())
            );

            if (currentFilter === 'saved') filtered = filtered.filter(a => isArticleSaved(a.id));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="glossy-card p-8 rounded-3xl text-center text-sagDark y2k-shadow col-span-full"><p class="font-bold text-lg">No dispatches match your filter! ✨</p></div>`;
                return;
            }

            filtered.forEach(article => {
                const card = document.createElement('div');
                card.className = "glossy-card p-6 rounded-3xl text-sagDark y2k-shadow hover:-translate-y-1 transition-all space-y-4 flex flex-col justify-between";
                card.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex items-center justify-between text-xs text-sagAccent font-bold">
                            <span>${article.date}</span>
                            <button onclick="toggleBookmark('${article.id}')" class="hover:scale-125 transition-transform text-sagAccent">
                                <i class="${isArticleSaved(article.id) ? 'fa-solid' : 'fa-regular'} fa-bookmark text-base"></i>
                            </button>
                        </div>
                        <div onclick="openArticleDetail('${article.id}')" class="cursor-pointer space-y-2 group">
                            <h2 class="font-editorial text-xl md:text-2xl font-bold text-sagDark group-hover:text-sagHeader transition-colors">${article.title}</h2>
                            <p class="text-xs text-gray-700 leading-relaxed font-normal">${article.snippet}</p>
                        </div>
                        ${article.image ? `<div onclick="openArticleDetail('${article.id}')" class="cursor-pointer overflow-hidden rounded-2xl border-2 border-pink-200"><img src="${article.image}" class="w-full h-44 object-cover hover:scale-105 transition-transform duration-500"></div>` : ''}
                    </div>
                    <div class="flex items-center justify-end pt-3 border-t border-pink-100 text-xs font-bold mt-2">
                        <button onclick="openArticleDetail('${article.id}')" class="bg-sagHeader text-white px-4 py-1.5 rounded-full text-xs font-bold y2k-shadow-sm hover:brightness-110">Read ✨</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderThoughts() {
            const container = document.getElementById('thoughts-container');
            container.innerHTML = '';
            thoughtsData.forEach(t => {
                const card = document.createElement('div');
                card.className = "glossy-card p-5 rounded-3xl text-sagDark y2k-shadow space-y-3 flex flex-col justify-between";
                card.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex justify-between items-center text-[11px] font-bold text-sagAccent">
                            <span>${t.author}</span><span>${t.date}</span>
                        </div>
                        <p class="text-xs md:text-sm font-semibold leading-relaxed text-gray-800">"${t.text}"</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function openArticleDetail(id) {
            const article = articlesData.find(a => a.id === id);
            if (!article) return;
            activeArticleId = id;

            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('thoughts-view').classList.add('hidden');
            const detailView = document.getElementById('detail-view');
            detailView.classList.remove('hidden');

            const contentBox = document.getElementById('article-content-box');
            contentBox.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between text-xs text-sagAccent font-bold">
                        <span>${article.date}</span>
                        <button onclick="toggleBookmark('${article.id}')" class="hover:scale-125 transition-transform text-sagAccent text-lg">
                            <i class="${isArticleSaved(article.id) ? 'fa-solid' : 'fa-regular'} fa-bookmark"></i>
                        </button>
                    </div>
                    <h1 class="font-editorial text-2xl md:text-4xl font-bold text-sagDark">${article.title}</h1>
                    ${article.image ? `<div class="rounded-2xl overflow-hidden border-2 border-pink-200"><img src="${article.image}" class="w-full h-64 object-cover"></div>` : ''}
                    <div class="prose text-sm text-gray-800 leading-relaxed whitespace-pre-line font-normal pt-2">${article.content}</div>
                </div>

                <!-- Engagement Section (Supabase Likes & Comments) -->
                <div class="border-t border-pink-200 pt-6 mt-8 space-y-6">
                    <div class="flex items-center justify-between">
                        <button onclick="handleLike()" class="bg-pink-100 hover:bg-pink-200 text-sagAccent font-bold px-4 py-2 rounded-full text-xs flex items-center gap-2 transition-all y2k-shadow-sm">
                            <i class="fa-solid fa-heart text-red-500"></i> <span id="like-count">0</span> Likes
                        </button>
                    </div>

                    <!-- Comments Area -->
                    <div class="space-y-4 pt-4">
                        <h3 class="font-bold text-sm text-sagDark">Leave a Note ✨</h3>
                        <div class="space-y-3">
                            <input type="text" id="comment-author" placeholder="Your name or handle" class="w-full px-4 py-2 rounded-xl text-xs bg-pink-50/50 border border-pink-200 focus:outline-none focus:ring-2 focus:ring-yellow-300">
                            <textarea id="comment-content" rows="3" placeholder="Write your thoughts..." class="w-full px-4 py-2 rounded-xl text-xs bg-pink-50/50 border border-pink-200 focus:outline-none focus:ring-2 focus:ring-yellow-300"></textarea>
                            <button onclick="postComment()" class="bg-sagHeader text-white font-bold px-5 py-2 rounded-xl text-xs y2k-shadow-sm hover:brightness-110">Post Comment 🚀</button>
                        </div>

                        <div id="comments-list" class="space-y-3 pt-4">
                            <p class="text-xs text-gray-500 italic">Loading notes...</p>
                        </div>
                    </div>
                </div>
            `;

            await fetchLikes();
            await fetchComments();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- SUPABASE API CALLS ---
        async function fetchLikes() {
            try {
                const { data, error } = await _supabase
                    .from('article_likes')
                    .select('likes_count')
                    .eq('article_id', activeArticleId)
                    .single();
                
                if (data) {
                    document.getElementById('like-count').innerText = data.likes_count || 0;
                } else {
                    document.getElementById('like-count').innerText = 0;
                }
            } catch (err) {
                console.error("Error fetching likes:", err);
            }
        }

        async function handleLike() {
            try {
                const countEl = document.getElementById('like-count');
                let currentLikes = parseInt(countEl.innerText) || 0;
                currentLikes++;
                countEl.innerText = currentLikes;

                // Upsert to Supabase
                await _supabase
                    .from('article_likes')
                    .upsert({ article_id: activeArticleId, likes_count: currentLikes }, { onConflict: 'article_id' });
                
                showNotification("Liked! ❤️", "Thanks for showing love.");
            } catch (err) {
                console.error("Error updating like:", err);
            }
        }

        async function fetchComments() {
            try {
                const { data, error } = await _supabase
                    .from('article_comments')
                    .select('*')
                    .eq('article_id', activeArticleId)
                    .order('created_at', { ascending: false });

                const listEl = document.getElementById('comments-list');
                if (!data || data.length === 0) {
                    listEl.innerHTML = `<p class="text-xs text-gray-500 italic">No notes yet. Be the first to leave one!</p>`;
                    return;
                }

                listEl.innerHTML = data.map(c => `
                    <div class="bg-white/80 p-3.5 rounded-2xl border border-pink-100 flex justify-between items-start gap-3">
                        <div class="space-y-1">
                            <p class="text-xs font-bold text-sagAccent">${escapeHtml(c.author || 'Anonymous')}</p>
                            <p class="text-xs text-gray-800">${escapeHtml(c.content)}</p>
                        </div>
                        <button onclick="deleteComment('${c.id}')" class="text-gray-400 hover:text-red-500 text-xs px-1.5 py-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error fetching comments:", err);
            }
        }

        async function postComment() {
            const author = document.getElementById('comment-author').value.trim() || 'Anonymous';
            const content = document.getElementById('comment-content').value.trim();

            if (!content) {
                showNotification("Oops!", "Please write something before posting.");
                return;
            }

            try {
                const { error } = await _supabase
                    .from('article_comments')
                    .insert([{ article_id: activeArticleId, author, content }]);

                if (error) throw error;

                document.getElementById('comment-content').value = '';
                showNotification("Posted! 💌", "Your note is now live.");
                await fetchComments();
            } catch (err) {
                console.error("Error posting comment:", err);
                showNotification("Error", "Could not post comment. Check Supabase RLS policies.");
            }
        }

        async function deleteComment(id) {
            try {
                const { error } = await _supabase
                    .from('article_comments')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                showNotification("Deleted", "Note removed.");
                await fetchComments();
            } catch (err) {
                console.error("Error deleting comment:", err);
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial load
        renderArticles();
    </script>
</body>
</html>
